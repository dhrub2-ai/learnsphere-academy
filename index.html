<div class="stat-grid"><div class="stat"><div class="stat-icon">${ic('trophy',23)}</div><div><div class="stat-num">${s.total}</div><div class="stat-label">Quizzes completed</div></div></div><div class="stat"><div class="stat-icon lav">${ic('chart',23)}</div><div><div class="stat-num">${s.percent}%</div><div class="stat-label">Average accuracy</div></div></div><div class="stat"><div class="stat-icon blue">${ic('book-open',23)}</div><div><div class="stat-num">${s.done}<span style="color:var(--faint);font-size:15px"> / ${LESSONS.length}</span></div><div class="stat-label">Lessons completed</div></div></div></div>
<div class="section-row"><div><h2>Discover your subjects</h2><p>Find a topic worth exploring today.</p></div><button class="text-link" data-action="nav" data-view="quizzes">All quizzes ${ic('arrow',15)}</button></div><div class="subjects-grid">${SUBJECTS.map(subjectCard).join('')}</div>
<div class="section-row"><div><h2>Learn something new</h2><p>Bite-sized lessons for bigger breakthroughs.</p></div><button class="text-link" data-action="nav" data-view="lessons">View all lessons ${ic('arrow',15)}</button></div><div class="lesson-grid">${LESSONS.filter(l=>!completed.includes(l.id)).slice(0,3).concat(LESSONS.filter(l=>completed.includes(l.id)).slice(0,Math.max(0,3-LESSONS.filter(l=>!completed.includes(l.id)).length))).map(lessonCard).join('')}</div>`}
function quizzes(){let subjects=SUBJECTS.filter(s=>state.filter==='all'||state.filter===s.id);let q=state.search.trim().toLowerCase();if(q)subjects=subjects.filter(s=>(s.title+' '+s.description).toLowerCase().includes(q));return `<div class="page-head"><div class="eyebrow">PRACTICE MAKES PROGRESS</div><h1>Quiz Library</h1><p>Choose your topic and challenge yourself. Your score appears only after you finish the quiz.</p></div><div class="banner-card"><div><div class="eyebrow" style="color:#88eacb">${ic('bolt',14)} &nbsp;QUICK CHALLENGE</div><h3>Feel like trying a little of everything?</h3><p>A mixed quiz from across your subject library. Discover what you already know.</p></div><button class="btn white" data-action="setup" data-subject="mixed">Start mixed quiz ${ic('arrow',17)}</button></div>
<div class="toolbar" role="group" aria-label="Filter subjects">${[['all','All subjects'],...SUBJECTS.map(s=>[s.id,s.short])].map(([id,t])=>`<button class="filter-pill ${state.filter===id?'selected':''}" data-action="filter-quiz" data-filter="${id}">${esc(t)}</button>`).join('')}</div><div class="toolbar"><label class="visually-hidden" for="qsearch">Search subjects</label><input id="qsearch" class="form-input" style="max-width:350px" type="search" placeholder="Search subjects…" value="${esc(state.search)}" /></div><div class="course-grid">${subjects.map(s=>{const previous=history.filter(h=>h.subject===s.id).sort((a,b)=>b.percent-a.percent)[0];return `<article class="course-card" style="--subject-accent:${s.accent}"><div class="course-mark">${ic(s.icon,29)}</div><div class="course-body"><div class="badge">${esc(s.level)}</div><h3 style="margin-top:12px">${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="course-foot"><span class="badge">${ic('book',13)} ${pool(s.id).length} questions</span><button class="btn small-btn" data-action="setup" data-subject="${s.id}">Take quiz ${ic('arrow',14)}</button></div>${previous?`<div class="tiny muted" style="margin-top:10px">Personal best: ${previous.percent}%</div>`:''}</div></article>`}).join('')||'<div class="empty-state">No subjects match your search.</div>'}</div>${custom.length?`<div class="section-row"><h2>Your question bank</h2></div>${customCourse()}`:''}`}
function customCourse(){const s=meta('custom');return `<div class="course-card" style="--subject-accent:${s.accent};max-width:540px"><div class="course-mark">${ic('pencil',27)}</div><div class="course-body"><div class="badge">Made by you</div><h3 style="margin-top:12px">Your custom questions</h3><p>Personal practice from Quiz Studio.</p><div class="course-foot"><span class="badge">${custom.length} questions</span><button class="btn small-btn" data-action="setup" data-subject="custom">Take quiz ${ic('arrow',14)}</button></div></div></div>`}
function lessons(){return `<div class="page-head"><div class="eyebrow">LEARN A LITTLE EVERY DAY</div><h1>Learning Paths</h1><p>Clear, short lessons that build your understanding before you test your knowledge.</p></div><div class="toolbar">${[['all','All lessons'],...SUBJECTS.map(s=>[s.id,s.short])].map(([id,t])=>`<button class="filter-pill ${state.lessonFilter===id?'selected':''}" data-action="filter-lessons" data-filter="${id}">${esc(t)}</button>`).join('')}</div><div class="lesson-grid">${LESSONS.filter(l=>state.lessonFilter==='all'||l.subject===state.lessonFilter).map(lessonCard).join('')}</div>`}
function readLesson(){const l=LESSONS.find(x=>x.id===state.lessonId);if(!l){navigate('lessons');return ''}const s=meta(l.subject);return `<div class="lesson-detail"><button class="text-link" data-action="nav" data-view="lessons">${ic('back',15)} Back to lessons</button><article class="reading-card" style="margin-top:24px"><div class="eyebrow" style="color:${s.accent}">${esc(s.title)} &nbsp;·&nbsp; ${l.time} MIN READ</div><h1>${esc(l.title)}</h1><p class="reading-intro">${esc(l.subtitle)}. This quick guide focuses on the ideas you can remember and apply.</p>${l.points.map((p,i)=>`<div class="reading-point"><div class="point-index">0${i+1}</div><div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></div></div>`).join('')}<div class="takeaway"><small>${ic('spark',15)} &nbsp;THE BIG IDEA</small><p>${esc(l.takeaway)}</p></div><div class="setup-foot"><button class="btn secondary" data-action="setup" data-subject="${s.id}">${ic('bolt',16)} Practise with a quiz</button><button class="btn" data-action="complete-lesson" data-id="${l.id}">${ic('checkcircle',16)} ${completed.includes(l.id)?'Completed · Next lesson':'Mark as complete'}</button></div></article></div>`}
function setup(){const s=state.subject==='mixed'?{title:'Mixed Knowledge Challenge',icon:'spark',accent:'#65dfbf',description:'A surprise mix of all your subjects.'}:meta(state.subject);const total=pool(state.subject).length;const counts=[10,20,total].filter((v,i,a)=>v<=total&&a.indexOf(v)===i);return `<div class="setup-wrap"><button class="text-link" data-action="nav" data-view="quizzes">${ic('back',15)} Back to quizzes</button><div class="setup-card" style="margin-top:20px"><div class="eyebrow">READY WHEN YOU ARE</div><div class="setup-header" style="margin-top:18px;--subject-accent:${s.accent}"><div class="course-mark">${ic(s.icon,29)}</div><div><h2>${esc(s.title)}</h2><p>${esc(s.description)}</p></div></div><p class="field-title">How many questions would you like?</p><div class="choice-row">${counts.map((c,i)=>`<button class="choice-card ${state.count===c?'selected':''}" data-action="count" data-count="${c}"><b>${c}</b><span>${c===total?'Full challenge':c===10?'Quick practice':'Deep practice'}</span></button>`).join('')}</div><div class="setup-hint">${ic('shield',20)}<span>Pick one answer per question. You can skip questions or revisit them. <strong>Your score and answer explanations appear only after final submission.</strong> Progress stays on this device.</span></div><div class="setup-foot"><button class="btn ghost" data-action="nav" data-view="quizzes">Maybe later</button><button class="btn" data-action="start" ${total?'':'disabled'}>Start ${Math.min(state.count,total)} questions ${ic('arrow',16)}</button></div></div></div>`}
function quiz(){if(!state.quiz)return '';const session=state.quiz;const q=session.questions[session.index];const value=session.answers[q.id];const n=session.questions.length;return `<div class="quiz-container"><div class="quiz-top"><div><div class="eyebrow">YOUR CHALLENGE</div><strong>${esc(session.title)}</strong><small>${answered(session.answers)} of ${n} answered</small></div><button class="btn ghost small-btn" data-action="quit">${ic('x',14)} Exit quiz</button></div><div class="progress-track" aria-label="Quiz progress"><div class="progress-fill" style="width:${100*(session.index+1)/n}%"></div></div><div class="question-shell"><div class="question-kicker"><span>QUESTION ${session.index+1} / ${n}</span><span>${esc(meta(q.subject).short.toUpperCase())}</span></div><h2>${esc(q.question)}</h2><div class="options" role="group" aria-label="Answer options">${q.options.map((option,i)=>`<button type="button" data-action="answer" data-choice="${i}" class="option ${value===i?'selected':''}" aria-pressed="${value===i}"><span class="opt-letter">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('')}</div></div><div class="quiz-controls"><button class="btn ghost" data-action="prev" ${session.index===0?'disabled':''}>${ic('back',16)} Previous</button><div class="quiz-controls-right"><button class="btn secondary" data-action="clear-answer">Clear answer</button>${session.index===n-1?`<button class="btn" data-action="submit">Finish quiz ${ic('check',16)}</button>`:`<button class="btn" data-action="next">Next question ${ic('arrow',16)}</button>`}</div></div><div class="jump-card"><h3>JUMP TO QUESTION · Selected answers are highlighted</h3><div class="jump-grid">${session.questions.map((it,i)=>`<button class="jump-btn ${session.index===i?'current':Number.isInteger(session.answers[it.id])?'answered':''}" aria-label="Go to question ${i+1}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div></div></div>`}
function result(){const r=state.result;if(!r)return '';const wrong=r.items.filter(({choice,q})=>choice!==q.answer).length;const grade=r.percent>=90?'Outstanding work!':r.percent>=70?'Great progress!':r.percent>=50?'Keep it going!':'Every expert starts somewhere.';return `<div class="quiz-container"><section class="result-header"><div class="eyebrow" style="color:#9ff5de;margin-bottom:16px">CHALLENGE COMPLETE</div><div class="result-ring" style="--percent:${r.percent}"><div class="result-ring-inner"><b>${r.percent}%</b><small>ACCURACY</small></div></div><h1>${grade}</h1><p>You answered ${r.correct} of ${r.items.length} questions correctly.</p><div class="result-details"><span class="badge">${ic('checkcircle',14)} ${r.correct} correct</span><span class="badge">${ic('x',14)} ${wrong} incorrect / skipped</span><span class="badge">${ic('trophy',14)} Score: ${r.correct}/${r.items.length}</span></div></section>${r.liveSession?`<div class="live-submit-banner">${r.liveStatus==='saved'?`${ic('checkcircle',17)} Score published to the live winner dashboard.`:r.liveStatus==='sending'?`${ic('clock',17)} Publishing your score to the live dashboard…`:`${ic('info',17)} Score could not be published. Check your connection and retry.`}<div class="live-buttons"><button class="btn secondary small-btn" data-action="nav" data-view="live">View leaderboard ${ic('arrow',15)}</button>${r.liveStatus==='failed'?'<button class="btn small-btn" data-action="retry-live-result">Retry score submission</button>':''}</div></div>`:''}<div class="section-row"><div><h2>Review your answers</h2><p>Understand why each answer is right.</p></div></div>${r.items.map(({q,choice},i)=>`<article class="review-card"><div class="review-top ${choice===q.answer?'ok':'bad'}">${ic(choice===q.answer?'checkcircle':'x',16)} QUESTION ${i+1} · ${choice===q.answer?'Correct':choice===null?'Not answered':'Incorrect'}</div><h3>${esc(q.question)}</h3><div class="review-answer"><strong>Your answer:</strong> ${choice===null?'Skipped':esc(q.options[choice])}</div><div class="review-answer ok"><strong>Correct answer:</strong> ${esc(q.options[q.answer])}</div><p class="explain">${ic('info',14)} ${esc(q.explanation)}</p></article>`).join('')}<div class="setup-foot" style="margin-top:22px"><button class="btn secondary" data-action="export-result">${ic('download',16)} Download results</button><div style="display:flex;gap:10px;flex-wrap:wrap">${wrong?`<button class="btn ghost" data-action="retry-wrong">Review weak spots ${ic('restart',15)}</button>`:''}<button class="btn" data-action="nav" data-view="quizzes">Another quiz ${ic('arrow',16)}</button></div></div></div>`}
function progress(){const s=stats();const latest=[...history].slice(-8).reverse();return `<div class="page-head"><div class="eyebrow">YOUR JOURNEY, IN NUMBERS</div><h1>My Progress</h1><p>Every attempt is a step forward. Progress is saved in this browser on this device only.</p></div><div class="stat-grid"><div class="stat"><div class="stat-icon">${ic('trophy',24)}</div><div><div class="stat-num">${s.total}</div><div class="stat-label">Quizzes taken</div></div></div><div class="stat"><div class="stat-icon lav">${ic('chart',24)}</div><div><div class="stat-num">${s.percent}%</div><div class="stat-label">Average score</div></div></div><div class="stat"><div class="stat-icon blue">${ic('book-open',24)}</div><div><div class="stat-num">${s.done}</div><div class="stat-label">Lessons learned</div></div></div></div><div class="section-row"><h2>Subject performance</h2></div><section class="progress-panel">${SUBJECTS.map(x=>{const h=history.filter(a=>a.subject===x.id);const avg=h.length?Math.round(h.reduce((tot,b)=>tot+b.percent,0)/h.length):0;return `<div class="progress-row"><div><strong>${esc(x.short)}</strong><br/><span>${h.length} attempts</span></div><div class="progress-bar" style="--fill:${x.accent}"><span style="width:${avg}%"></span></div><strong style="text-align:right">${avg}%</strong></div>`}).join('')}</section><div class="section-row"><h2>Recent quiz attempts</h2></div>${latest.length?`<section class="progress-panel">${latest.map(r=>`<div style="display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--outline);padding:13px 0"><div><strong style="font-size:13px">${esc(r.title)}</strong><div class="tiny muted">${esc(new Date(r.date).toLocaleDateString())} · ${r.correct}/${r.count} correct</div></div><span class="badge ${r.percent>=70?'green':''}">${r.percent}%</span></div>`).join('')}</section>`:`<div class="empty-state">${ic('chart',35)}<h3>Your progress story begins here.</h3><p>Complete your first quiz to start seeing scores and trends.</p><button class="btn" data-action="nav" data-view="quizzes">Choose a quiz ${ic('arrow',15)}</button></div>`}<div class="section-row"><h2>My learning</h2></div><div class="progress-panel"><strong>${completed.length} of ${LESSONS.length} lessons completed</strong><div class="progress-bar" style="margin-top:14px"><span style="width:${Math.round(100*completed.length/LESSONS.length)}%"></span></div><p style="font-size:12px;margin:12px 0 0">Mark lessons complete as you read them.</p></div>`}
function studio(){return `<div class="page-head"><div class="eyebrow">MAKE LEARNING YOUR OWN</div><h1>Quiz Studio</h1><p>Create questions without writing any code. Your question bank is stored only in this browser; export a backup to move it to another device.</p></div><div class="studio-grid"><section class="form-panel"><h3>${ic('plus',18)} Add a question</h3><p>Write a clear question, four options and one correct answer.</p><form id="question-form"><label class="field" for="s-question">Question</label><textarea class="form-input" id="s-question" maxlength="700" required placeholder="What would you like to ask?"></textarea><div class="two-col">${['A','B','C','D'].map(k=>`<div><label class="field" for="s-${k}">Option ${k}</label><input class="form-input" id="s-${k}" maxlength="350" required placeholder="Answer ${k}"/></div>`).join('')}</div><label class="field" for="s-correct">Correct option</label><select class="form-input" id="s-correct">${['A','B','C','D'].map((k,i)=>`<option value="${i}">${k}</option>`).join('')}</select><label class="field" for="s-explain">Answer explanation</label><textarea id="s-explain" class="form-input" maxlength="1000" required placeholder="Explain why this answer is correct."></textarea><button class="btn" style="margin-top:19px" type="submit">${ic('plus',16)} Save question</button></form></section><section class="form-panel"><h3>Your personal question bank</h3><p><strong>${custom.length}</strong> saved question${custom.length===1?'':'s'}. Import or export as a simple JSON file.</p><div class="toolbar"><button class="btn secondary small-btn" data-action="export-custom">${ic('download',15)} Export questions</button><button class="btn secondary small-btn" data-action="import-pick">${ic('upload',15)} Import JSON</button><input class="visually-hidden" id="import-file" type="file" accept="application/json,.json" aria-label="Import quiz JSON" /></div>${custom.length?`<div class="studio-list">${custom.map((q,i)=>`<div class="studio-question"><div><b>${esc(q.question)}</b><p>Answer: ${esc(q.options[q.answer])}</p></div><button class="icon-button" data-action="remove-custom" data-index="${i}" aria-label="Delete question">${ic('trash',16)}</button></div>`).join('')}</div><div style="margin-top:18px"><button class="btn" data-action="setup" data-subject="custom">Practise my questions ${ic('arrow',15)}</button></div>`:`<div class="empty-state">${ic('book-open',33)}<h3>Space for your ideas</h3><p>Add your first question to create a personal quiz.</p></div>`}<p class="studio-tip" style="margin-top:18px">${ic('info',15)} <strong>Important:</strong> Questions added here are not automatically visible to website visitors. To publish them for everyone, export the JSON and incorporate it into the website’s source file. The included README explains how.</p></section></div>`}
function render(){let body='';switch(state.view){case'dashboard':body=dashboard();break;case'quizzes':body=quizzes();break;case'live':body=window.LSLive?.view()||'<div class="empty-state">Loading Live Quiz…</div>';break;case'lessons':body=lessons();break;case'lesson':body=readLesson();break;case'setup':body=setup();break;case'quiz':body=quiz();break;case'result':body=result();break;case'progress':body=progress();break;case'studio':body=studio();break;default:body=dashboard()}app.innerHTML=layout(body);if(window.LSLive?.mount)window.LSLive.mount();document.title=(state.view==='dashboard'?'LearnSphere Academy':(nav.find(n=>n[0]===state.view)?.[2]||'LearnSphere')+' · LearnSphere Academy')}
function showDialog(title,message,confirm,onConfirm,warning=false){const wrap=document.createElement('div');wrap.className='dialog-backdrop';wrap.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h3 id="dialog-title">${esc(title)}</h3><p>${esc(message)}</p><div class="dialog-actions"><button class="btn ghost" id="dlg-cancel">Cancel</button><button class="btn ${warning?'warn':''}" id="dlg-yes">${esc(confirm)}</button></div></div>`;document.body.appendChild(wrap);const cancel=()=>wrap.remove();wrap.querySelector('#dlg-cancel').onclick=cancel;wrap.querySelector('#dlg-yes').onclick=()=>{cancel();onConfirm()};wrap.addEventListener('click',e=>{if(e.target===wrap)cancel()});wrap.querySelector('#dlg-yes').focus()}
function startWithQuestions(list,title,subject){state.quiz={questions:list,index:0,answers:{},title,subject};navigate('quiz')}
function shuffle(values){let a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function submit(){const sess=state.quiz;if(!sess)return;const liveSession=sess.live||null;const items=sess.questions.map(q=>({q,choice:Number.isInteger(sess.answers[q.id])?sess.answers[q.id]:null}));const correct=items.filter(item=>item.choice===item.q.answer).length;const percent=Math.round(100*correct/items.length);state.result={items,correct,percent,title:sess.title,subject:sess.subject,liveSession,liveStatus:liveSession?'sending':null};history.push({date:new Date().toISOString(),subject:sess.subject,title:sess.title,correct,count:items.length,percent});history=history.slice(-200);store('ls_history_v1',history);state.quiz=null;navigate('result');if(liveSession)sendLiveResult()}
function sendLiveResult(){const r=state.result;if(!r?.liveSession||!window.LSLive)return;r.liveStatus='sending';render();window.LSLive.recordScore(r.liveSession,{correct:r.correct,count:r.items.length,percent:r.percent}).then(()=>{if(state.result===r){r.liveStatus='saved';render()}}).catch(err=>{if(state.result===r){r.liveStatus='failed';render()}toast('Live score was not saved: '+err.message)})}
function saveText(filename,contents,mime){const url=URL.createObjectURL(new Blob([contents],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvEscape(value){return '"'+String(value??'').replaceAll('"','""')+'"'}
function handleClick(btn){const action=btn.dataset.action;if(!action)return;switch(action){case'nav':if(state.quiz&&state.view==='quiz'){showDialog('Leave this quiz?','Your current answers will not be saved.','Leave quiz',()=>{state.quiz=null;navigate(btn.dataset.view)},true)}else navigate(btn.dataset.view);break;
case'theme':theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;store('ls_theme_v1',theme);render();break;
case'filter-quiz':state.filter=btn.dataset.filter;render();break;
case'filter-lessons':state.lessonFilter=btn.dataset.filter;render();break;
case'setup':state.subject=btn.dataset.subject;state.count=Math.min(10,pool(state.subject).length);if(pool(state.subject).length===0){toast('Please add questions to your bank first.');navigate('studio')}else navigate('setup');break;
case'count':state.count=Number(btn.dataset.count);render();break;
case'start':{const s=state.subject;const all=pool(s);const questions=shuffle(all).slice(0,Math.max(1,Math.min(all.length,state.count)));const title=s==='mixed'?'Mixed Knowledge Challenge':meta(s).title;startWithQuestions(questions,title,s);break}
case'answer':{const ss=state.quiz;ss.answers[ss.questions[ss.index].id]=Number(btn.dataset.choice);render();break}
case'clear-answer':{const ss=state.quiz;delete ss.answers[ss.questions[ss.index].id];render();break}
case'next':state.quiz.index=Math.min(state.quiz.questions.length-1,state.quiz.index+1);render();break;
case'prev':state.quiz.index=Math.max(0,state.quiz.index-1);render();break;
case'jump':state.quiz.index=Number(btn.dataset.index);render();break;
case'quit':showDialog('Leave this quiz?','Your answers have not been submitted and will be lost.','Leave quiz',()=>{state.quiz=null;navigate('quizzes')},true);break;
case'submit':{const remaining=state.quiz.questions.length-answered(state.quiz.answers);if(remaining)showDialog('Submit your quiz?',`${remaining} question${remaining===1?' is':'s are'} unanswered. Skipped questions count as incorrect.`, 'Submit now',submit);else showDialog('Submit your quiz?','Your final score and explanations will be shown after submission.','See my results',submit);break}
case'retry-live-result':sendLiveResult();break;
case'export-result':{const rows=[['Question','Your Answer','Correct Answer','Outcome','Explanation'],...state.result.items.map(({q,choice})=>[q.question,choice===null?'Skipped':q.options[choice],q.options[q.answer],choice===q.answer?'Correct':'Incorrect',q.explanation])];saveText('learnsphere-results.csv','\uFEFF'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');break}
case'retry-wrong':{const r=state.result;const questions=r.items.filter(x=>x.choice!==x.q.answer).map(x=>x.q);startWithQuestions(questions,'Review your weak spots',r.subject);break}
case'open-lesson':state.lessonId=btn.dataset.id;navigate('lesson');break;
case'complete-lesson':{const id=btn.dataset.id;if(!completed.includes(id)){completed.push(id);store('ls_completed_v1',completed)}const idx=LESSONS.findIndex(l=>l.id===id);const next=LESSONS.slice(idx+1).find(l=>l.subject===LESSONS[idx].subject);if(next){state.lessonId=next.id;navigate('lesson');toast('Lesson completed! Next lesson opened.')}else{navigate('lessons');toast('Lesson completed!')}break}
case'export-custom':saveText('learnsphere-custom-questions.json',JSON.stringify(custom.map(q=>({question:q.question,options:q.options,answer:q.answer,explanation:q.explanation})),null,2),'application/json');break;
case'import-pick':document.getElementById('import-file').click();break;
case'remove-custom':{const index=Number(btn.dataset.index);showDialog('Delete this question?','This removes the question from this browser’s personal bank.','Delete',()=>{custom.splice(index,1);store('ls_custom_v1',custom);render();toast('Question deleted.')},true);break}
default:if(window.LSLive?.click)window.LSLive.click(btn);break;}}
function cleanImported(q,i){if(!q||typeof q!=='object'||typeof q.question!=='string'||!q.question.trim()||q.question.length>700||!Array.isArray(q.options)||q.options.length!==4||q.options.some(v=>typeof v!=='string'||!v.trim()||v.length>350)||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||typeof q.explanation!=='string'||!q.explanation.trim()||q.explanation.length>1000)throw Error('Question '+(i+1)+' has an invalid format.');return{id:'custom-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2),subject:'custom',question:q.question.trim(),options:q.options.map(v=>v.trim()),answer:q.answer,explanation:q.explanation.trim()}}
app.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn)handleClick(btn)});
app.addEventListener('submit',e=>{if(e.target.id!=='question-form'){if(window.LSLive?.submit)window.LSLive.submit(e);return;}e.preventDefault();if(custom.length>=500){toast('Maximum 500 custom questions on this device.');return}try{const q=cleanImported({question:document.getElementById('s-question').value,options:['A','B','C','D'].map(x=>document.getElementById('s-'+x).value),answer:Number(document.getElementById('s-correct').value),explanation:document.getElementById('s-explain').value},custom.length);custom.push(q);store('ls_custom_v1',custom);render();toast('Question saved to your bank.')}catch(err){toast(err.message)}});
app.addEventListener('input',e=>{if(e.target.id==='qsearch'){const pos=e.target.selectionStart;state.search=e.target.value;render();const fresh=document.getElementById('qsearch');if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos)}catch{}}}});
app.addEventListener('change',e=>{if(e.target.id!=='import-file')return;const file=e.target.files[0];if(!file)return;if(file.size>2000000){toast('JSON file is too large.');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!Array.isArray(parsed))throw Error('JSON must contain an array of questions.');if(parsed.length>500-custom.length)throw Error('Maximum 500 custom questions allowed.');const incoming=parsed.map(cleanImported);custom=custom.concat(incoming);store('ls_custom_v1',custom);render();toast(`Imported ${incoming.length} question${incoming.length===1?'':'s'}.`)}catch(err){toast('Import failed: '+err.message)}};reader.onerror=()=>toast('Could not read that file.');reader.readAsText(file)});
window.LearnSphereBridge={navigate,render,toast,startWithQuestions,showDialog,store,load,getSession:()=>state.quiz,setLiveSession:live=>{if(state.quiz)state.quiz.live=live},esc,ic,pool};
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(nav.some(n=>n[0]===page)){state.quiz=null;state.view=page;render()}});
render();
})();

<script>

(() => {

  const state = {ready:false,error:'',busy:false,roomLoaded:false,code:'',meta:null,participants:{},results:{},notice:'',uid:'',name:'',joined:false,startedAt:0,remote:null,hostMode:false,qrValue:'',listeners:[],questions:null,formSubject:'banking',formCount:10};
  const knownSubjects=[...SUBJECTS.map(s=>[s.id,s.title]),['mixed','All subjects (mixed)'],['custom','My Custom Questions (imported in Quiz Studio)']];
  const params=new URLSearchParams(location.search);

  const roomURL=code=>`${location.origin}${location.pathname}?join=${encodeURIComponent(code)}#live`;
  const uid=()=>firebase.auth().currentUser?.uid||'';
  const fb=()=>firebase.database();

  function update(){if(location.hash==='#live'||!location.hash&&invite)B.render()}

  function listenToRoom(code){
    for(const [r,fn] of state.listeners)r.off('value',fn);
    state.listeners=[];state.code=code;state.meta=null;state.roomLoaded=false;state.participants={};state.results={};state.questions=null;state.joined=false;
    if(!state.ready){update();return}

      const r=ref(`${code}/${part}`);
      const fn=snap=>{state[part]=snap.val()||(part==='meta'||part==='questions'?null:{});if(part==='meta')state.roomLoaded=true;state.hostMode=!!(state.meta&&state.meta.hostUid===uid());state.joined=!!state.participants[uid()];state.name=state.participants[uid()]?.name||state.name;update()};
      r.on('value',fn,error=>notify(`Could not load live room: ${error.message}`));state.listeners.push([r,fn]);
    }

  }
  async function initialize(){
    if(!configured){if(invite){state.code=invite;B.navigate('live')}return}
    try{
      if(typeof firebase==='undefined')throw Error('Firebase scripts failed to load. Please check your internet connection.');

  }
  function instructions(){return `<div class="page-head"><div class="eyebrow">FACILITATOR STUDIO</div><h1>Live Quiz & Winners</h1><p>Bring your participants together: show a QR code, conduct the quiz on their devices, and display a live leaderboard.</p></div><div class="live-grid"><section class="live-panel"><div class="live-icon">${ic('users',25)}</div><h2>One-time free setup</h2><p>Your regular lessons and quizzes already work. To share results across participants, connect a free Firebase Realtime Database.</p><div class="setup-steps"><div><b>01</b> Create a free Firebase Spark project.</div><div><b>02</b> Enable anonymous sign-in and Realtime Database.</div><div><b>03</b> Publish the rules in <code>firebase-rules.json</code>.</div><div><b>04</b> Paste the web configuration into <code>live-config.js</code> and upload the updated files to GitHub.</div></div><p class="tiny muted">No payment card needed within Spark free limits. Full illustrated-by-steps instructions are in <b>LIVE-QUIZ-SETUP.md</b>.</p><a class="btn" href="https://console.firebase.google.com/" target="_blank" rel="noopener noreferrer">Open Firebase Console ${ic('arrow',15)}</a></section><section class="live-panel live-splash"><div class="eyebrow">WHAT YOU WILL GET</div><div class="live-feature">${ic('checkcircle',21)} One scan to join the quiz</div><div class="live-feature">${ic('checkcircle',21)} Names and participant count</div><div class="live-feature">${ic('checkcircle',21)} Automatic scores and top 3 winners</div><div class="live-feature">${ic('checkcircle',21)} Large projector-friendly scoreboard</div><div class="live-feature">${ic('checkcircle',21)} CSV export for your records</div><div class="live-preview"><span>🥇</span><span>🥈</span><span>🥉</span></div></section></div>`}
  function landing(){return `<div class="page-head"><div class="eyebrow">INTERACTIVE CLASSROOM</div><h1>Live Quiz & Winners</h1><p>Launch an online challenge, show the joining QR code and display a winner dashboard in real time.</p></div>${state.error?`<div class="live-alert">${esc(state.error)}</div>`:''}<div class="live-grid"><section class="live-panel"><div class="live-icon">${ic('trophy',25)}</div><h2>Host a live quiz</h2><p>Choose a question bank and open a shared room for your participants.</p><form id="live-host-form"><label class="field" for="live-subject">Question bank</label><select id="live-subject" class="form-input">${knownSubjects.map(([v,t])=>`<option value="${v}" ${v===state.formSubject?'selected':''}>${esc(t)}</option>`).join('')}</select><p class="tiny muted" style="margin:8px 0 16px">Custom question bank: <b>${B.pool('custom').length}</b> questions on this browser. Import your JSON in Quiz Studio here before hosting.</p><label class="field" for="live-count">Number of questions</label><select id="live-count" class="form-input"><option value="10">10 questions</option><option value="20">20 questions</option><option value="25">25 questions</option></select><label class="field" for="live-title">Session title</label><input id="live-title" class="form-input" maxlength="70" value="Knowledge Championship" required/><button class="btn live-action" type="submit" ${state.busy?'disabled':''}>${ic('play',17)} Create live room</button></form></section><section class="live-panel"><div class="live-icon">${ic('users',25)}</div><h2>Join as participant</h2><p>Scan the facilitator's QR code or type the shared six-character room code.</p><form id="live-code-form"><label class="field" for="live-room-code">Room code</label><input id="live-room-code" class="form-input room-input" maxlength="8" placeholder="E.g. AB12CD" required autocomplete="off" autocapitalize="characters"/><button class="btn secondary live-action" type="submit">Join a room ${ic('arrow',15)}</button></form><p class="tiny muted" style="margin-top:25px">Everyone uses the same published website — no app install or participant account required.</p></section></div>`}
  function podium(){const r=rows();if(!r.length)return `<div class="live-empty">${ic('award',34)}<h3>Winners will appear here</h3><p>The leaderboard updates as participants finish and submit their quizzes.</p></div>`;const medal=['🥇','🥈','🥉'];return `<div class="podium">${r.slice(0,3).map((p,i)=>`<article class="podium-item place-${i+1}"><div class="podium-medal">${medal[i]}</div><div class="podium-rank">#${i+1}</div><strong>${esc(p.name)}</strong><div class="podium-score">${p.correct}<small> / ${p.total}</small></div><span>${p.percent}% accuracy</span></article>`).join('')}</div>`}
  const duration=ms=>{const seconds=Math.max(0,Math.round((ms||0)/1000));return `${Math.floor(seconds/60)}m ${String(seconds%60).padStart(2,'0')}s`};
  function scoreboard(){const r=rows();return `<section class="live-panel leaderboard" id="live-scores"><div class="live-title-row"><div><div class="eyebrow">LIVE WINNER DASHBOARD</div><h2>${ic('trophy',23)} Hall of Champions</h2></div><span class="chip">${ic('users',14)} ${r.length} submitted</span></div>${podium()}<div class="live-table-wrap"><table class="live-table"><thead><tr><th>Rank</th><th>Participant</th><th>Score</th><th>Accuracy</th><th>Time</th></tr></thead><tbody>${r.length?r.map((p,i)=>`<tr><td class="live-place">${i<3?['🥇','🥈','🥉'][i]:String(i+1)}</td><td><strong>${esc(p.name)}</strong></td><td>${p.correct} / ${p.total}</td><td><span class="badge ${p.percent>=70?'green':''}">${p.percent}%</span></td><td>${duration(p.durationMs)}</td></tr>`).join(''):`<tr><td colspan="5" class="muted">No submissions yet. Invite participants to start.</td></tr>`}</tbody></table></div><p class="tiny muted">Ranking: most correct answers, then fastest submitted quiz duration. Scores are suitable for informal training, not invigilated examinations.</p></section>`}
  function room(){const code=state.code;const m=state.meta;if(!m)return `<div class="page-head"><div class="eyebrow">ROOM ${esc(code)}</div><h1>${state.roomLoaded?'Room not found':'Finding your quiz room…'}</h1><p>${state.roomLoaded?'Please check the room code with the facilitator.':'Connecting to Firebase…'}</p></div><button class="btn secondary" data-action="live-leave">${ic('back',16)} Back to Live Quiz</button>`;
    if(state.hostMode){const join=roomURL(code);return `<div class="page-head"><div class="eyebrow">FACILITATOR CONTROL ROOM</div><h1>${esc(m.title)}</h1><p>Display this page on the projector and ask participants to scan the QR code.</p></div><div class="live-grid"><section class="live-panel"><div class="live-title-row"><div><div class="eyebrow">JOIN WITH YOUR PHONE</div><h2>Scan to participate</h2></div><span class="badge green">${m.status==='open'?'Open for entries':'Closed'}</span></div><div class="qr-frame" id="live-qr" data-url="${esc(join)}"></div><div class="join-code">${esc(code)}</div><p class="tiny muted">Or open this link on a mobile browser:</p><p class="join-link">${esc(join)}</p><div class="live-buttons"><button class="btn secondary small-btn" data-action="live-copy-link">${ic('check',15)} Copy link</button><button class="btn secondary small-btn" data-action="live-download-qr">${ic('download',15)} Save QR</button></div></section><section class="live-panel"><div class="eyebrow">SESSION CONTROL</div><h2>${ic('users',21)} ${Object.keys(state.participants).length} participants joined</h2><div class="live-metrics"><div><strong>${m.questionIds?.length||0}</strong><span>Questions</span></div><div><strong>${Object.keys(state.results).length}</strong><span>Submitted</span></div><div><strong>${Math.max(0,Object.keys(state.participants).length-Object.keys(state.results).length)}</strong><span>In progress</span></div></div><p><strong>Subject:</strong> ${esc(knownSubjects.find(s=>s[0]===m.subject)?.[1]||m.subject)}</p><p class="small muted">${m.status==='open'?'Room is open. Participants may join and submit scores.':'Room is closed. Existing leaderboard remains visible.'}</p><div class="live-buttons"><button class="btn" data-action="live-project">${ic('monitor',16)} Presentation view</button><button class="btn secondary" data-action="live-export">${ic('download',16)} Export results</button><button class="btn ghost" data-action="live-close" ${m.status==='closed'?'disabled':''}>Close quiz room</button></div><button class="text-link" style="margin-top:20px" data-action="live-leave">${ic('back',15)} Exit room view</button></section></div>${scoreboard()}<button class="btn project-exit" data-action="live-project">Exit presentation ${ic('x',15)}</button>`}
    if(m.status==='closed'&&!state.joined)return `<div class="page-head"><div class="eyebrow">ROOM ${esc(code)}</div><h1>${esc(m.title)}</h1><p>This session is closed to new participants.</p></div>${scoreboard()}<button class="btn secondary" data-action="live-leave">Back</button>`;
    return `<div class="page-head"><div class="eyebrow">LIVE QUIZ • ${esc(code)}</div><h1>${esc(m.title)}</h1><p>${esc(knownSubjects.find(s=>s[0]===m.subject)?.[1]||m.subject)} · ${m.questionIds.length} questions · One attempt per participant</p></div>${!state.joined?`<section class="live-panel" style="max-width:570px"><h2>You're invited!</h2><p>Enter your name so it appears on the winner dashboard after submission.</p><form id="live-join-form"><label class="field" for="live-name">Your display name</label><input class="form-input" id="live-name" maxlength="40" required minlength="2" autocomplete="name" placeholder="Full name"/><button class="btn live-action" type="submit">${ic('check',16)} Register & continue</button></form><p class="tiny muted">Your name and quiz result will be visible to people who have this room code. Avoid sharing private information.</p></section>`:
      `<div class="live-panel"><div class="live-title-row"><div><div class="eyebrow">WELCOME, ${esc(state.name)}</div><h2>${state.results[uid()]?'Quiz completed':'Ready for the challenge?'}</h2><p>${state.results[uid()]?'Your score has been submitted to the live dashboard.':m.status==='open'?'Take the quiz on this device. Your score appears after final submission.':'This room has been closed.'}</p>${m.subject==='custom'&&!state.questions?'<p class="tiny muted">Waiting for custom questions to load…</p>':''}</div><button class="btn" data-action="live-start" ${state.results[uid()]||m.status!=='open'||(m.subject==='custom'&&!state.questions)?'disabled':''}>${ic('play',16)} Start quiz</button></div></div>`}${scoreboard()}<button class="btn ghost" data-action="live-leave" style="margin-top:22px">${ic('back',15)} Back to live menu</button>`}
  function view(){if(!configured)return instructions();if(state.error)return `<div class="page-head"><h1>Live Quiz needs attention</h1><p>${esc(state.error)}</p><p>Verify Firebase configuration, anonymous authentication and your database rules.</p></div>`;if(!state.ready)return `<div class="page-head"><h1>Connecting to Live Quiz…</h1><p>Checking your connection securely.</p></div>`;return state.code?room():landing()}
  function mount(){const el=document.getElementById('live-qr');if(!el||!state.meta||!state.hostMode)return;const link=roomURL(state.code);if(location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname)){el.textContent='Publish the site on GitHub Pages before sharing the QR with participants. Local links cannot be opened from their phones.';return}if(typeof QRCode==='undefined'){el.textContent='QR code library could not load. Participants can use the room code or joining link.';return}try{new QRCode(el,{text:link,width:192,height:192,colorDark:'#13283e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR could not render. Use the joining link.'}}
  async function createRoom(form){
    state.formSubject=form.querySelector('#live-subject').value;
    state.formCount=+form.querySelector('#live-count').value;
    const title=form.querySelector('#live-title').value.trim();
    const subject=state.formSubject;
    const source=subject==='custom'?B.pool('custom'):subject==='mixed'?QUESTIONS:QUESTIONS.filter(q=>q.subject===subject);
    if(subject==='custom'&&source.length<state.formCount){
      throw Error(`You have ${source.length} custom questions in this browser. Import at least ${state.formCount} in Quiz Studio here, or select a smaller quiz.`);
    }
    if(source.length<state.formCount)throw Error(`Only ${source.length} questions are available for this selection.`);
    const arr=[...source];
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
    const selected=arr.slice(0,state.formCount);
    const questionIds=selected.map(q=>q.id);
    let code='',success=false;
    for(let attempt=0;attempt<4;attempt++){
      const nums=new Uint8Array(6);crypto.getRandomValues(nums);
      code=Array.from(nums,n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
      const res=await ref(`${code}/meta`).transaction(old=>old===null?{hostUid:uid(),title,subject,questionIds,status:'open',createdAt:firebase.database.ServerValue.TIMESTAMP}:undefined,undefined,false);
      if(res.committed){success=true;break}
    }
    if(!success)throw Error('Could not allocate a room code. Please retry.');
    if(subject==='custom'){
      // Store only the selected set; participants on other devices load these from Firebase.
      const payload=selected.map(q=>({id:q.id,subject:'custom',question:q.question,options:q.options,answer:q.answer,explanation:q.explanation}));
      try{
        await ref(`${code}/questions`).set(payload);
      }catch(error){
        await ref(`${code}/meta/status`).set('closed').catch(()=>{});
        throw Error('Could not publish the custom questions. Publish the UPDATED Firebase Realtime Database rules first. Details: '+error.message);
      }
    }
    listenToRoom(code);
    history.replaceState(null,'',location.pathname+'#live');
    notify('Live quiz room created. Share its joining QR code.');
  }
  async function join(code,name){const r=ref(`${code}/participants/${uid()}`);if(!state.meta||state.meta.status!=='open')throw Error('The room is not accepting new participants.');const out=await r.transaction(prev=>prev===null?{name:name.trim(),joinedAt:firebase.database.ServerValue.TIMESTAMP}:undefined,undefined,false);if(!out.committed&&!out.snapshot.exists())throw Error('Could not register your name.');state.joined=true;state.name=out.snapshot.val()?.name||name;update()}
  function startQuiz(){
    if(!state.joined||state.meta?.status!=='open'||state.results[uid()])return;
    const questionIds=state.meta.questionIds||[];
    let list;
    if(state.meta.subject==='custom'){
      const remote=state.questions;
      list=questionIds.map((id,i)=>remote?.[i]).filter(q=>q&&typeof q.question==='string'&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<=3);
      if(list.length!==questionIds.length||!list.every((q,i)=>q.id===questionIds[i])){
        notify('Custom questions are still loading or incomplete. Wait a moment, then try again.');return;
      }
    }else{
      list=questionIds.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
      if(list.length!==questionIds.length){notify('The question set has changed. Ask the facilitator to start a new room.');return}
    }
    state.startedAt=Date.now();
    B.startWithQuestions(list,state.meta.title,state.meta.subject);
    B.setLiveSession({code:state.code,uid:uid(),name:state.name,startedAt:state.startedAt});
  }
  async function recordScore(session,score){const path=`${session.code}/results/${session.uid}`;const value={name:session.name,correct:score.correct,total:score.count,percent:score.percent,durationMs:Math.max(1000,Date.now()-session.startedAt),finishedAt:firebase.database.ServerValue.TIMESTAMP};const res=await ref(path).transaction(old=>old===null?value:undefined,undefined,false);if(!res.committed)throw Error('This device already submitted a score for the room.');B.toast('Live score submitted! Open Live Quiz to view the leaderboard.')}
  async function submit(e){const f=e.target;if(!['live-host-form','live-code-form','live-join-form'].includes(f.id))return;e.preventDefault();if(state.busy)return;state.busy=true;try{if(f.id==='live-host-form')await createRoom(f);else if(f.id==='live-code-form'){const code=f.querySelector('#live-room-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(code.length<6)throw Error('Enter a six-character room code.');listenToRoom(code)}else await join(state.code,f.querySelector('#live-name').value)}catch(err){notify(err.message)}finally{state.busy=false;update()}}
  function click(btn){const a=btn.dataset.action;if(!a||!a.startsWith('live-'))return;
    switch(a){case 'live-start':startQuiz();break;
      case 'live-copy-link':navigator.clipboard?.writeText(roomURL(state.code)).then(()=>notify('Joining link copied.')).catch(()=>notify('Select and copy the link manually.'));break;
      case 'live-download-qr':{const target=document.querySelector('#live-qr canvas')||document.querySelector('#live-qr img');if(!target){notify('QR code not available.');return}const a=document.createElement('a');a.href=target.tagName==='CANVAS'?target.toDataURL('image/png'):target.src;a.download=`learnsphere-join-${state.code}.png`;a.click();break}
      case 'live-export':{const r=rows();const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const output=[['Rank','Name','Correct','Total','Percent','Duration seconds','Submitted at'],...r.map((p,i)=>[i+1,p.name,p.correct,p.total,p.percent,Math.round(p.durationMs/1000),new Date(p.finishedAt).toISOString()])].map(a=>a.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+output],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`learnsphere-results-${state.code}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}
      case 'live-leave':document.body.classList.remove('project-mode');history.replaceState(null,'',location.pathname+'#live');for(const [r,fn] of state.listeners)r.off('value',fn);state.listeners=[];state.code='';state.meta=null;update();break;
      case 'live-project':document.body.classList.toggle('project-mode');if(document.body.classList.contains('project-mode')){document.documentElement.requestFullscreen?.().catch(()=>{});B.toast('Projector mode enabled. Click Presentation view again to exit.')}else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});break;
      case 'live-close':B.showDialog('Close this live quiz?','No new participants or score submissions will be accepted. Existing results remain visible.','Close room',()=>{ref(`${state.code}/meta/status`).set('closed').then(()=>notify('Room closed. The winners remain visible.')).catch(e=>notify(e.message))},true);break;
    }
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('project-mode')});
  window.LSLive={view,mount,submit,click,recordScore};
  initialize();
})();

</script>
